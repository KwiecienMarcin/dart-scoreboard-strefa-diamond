<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strefa Diamond Dart Scoreboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="orientation-warning">
      <p>Ta aplikacja działa najlepiej w poziomie. Obróć urządzenie.</p>
    </div>

    <main id="app">
      <header class="topbar">
        <img src="/assets/logo_full.png" alt="Strefa Diamond" class="topbar-logo brand-logo" data-logo-candidates="/assets/logo_full.png,/assets/logo_full.PNG,assets/logo_full.png,assets/logo_full.PNG,./assets/logo_full.png,./assets/logo_full.PNG" />
        <button id="home-link" class="ghost-btn">🏠 Strona główna</button>
      </header>

      <section id="home-screen" class="screen active">
        <div class="hero-card">
          <div class="hero-glow"></div>
          <div class="logo-wrap">
            <img src="/assets/logo_full.png" alt="Strefa Diamond logo" class="hero-logo brand-logo" data-logo-candidates="/assets/logo_full.png,/assets/logo_full.PNG,assets/logo_full.png,assets/logo_full.PNG,./assets/logo_full.png,./assets/logo_full.PNG" />
          </div>
          <div class="brand-stack">
            <h1 class="brand-title">STREFA DIAMOND</h1>
            <p class="slogan">NAJLEPSZY WYMIAR DARTA</p>
          </div>

          <div class="home-language" role="group" aria-label="Language selector">
            <button id="lang-pl" class="lang-btn active" type="button">PL</button>
            <button id="lang-en" class="lang-btn" type="button">EN</button>
          </div>

          <div class="home-actions">
            <button id="go-scoreboard" class="primary-btn home-cta"><span>DART SCOREBOARD</span></button>
            <a class="secondary-btn home-cta" href="https://n01darts.com/n01/web"><span>NAKKA</span></a>
          </div>

          <div class="home-badges">
            <span>1-4 GRACZY</span>
            <span>DOUBLE / SINGLE OUT</span>
          </div>

          <div class="hero-credit">by Marcin Kwiecień</div>
        </div>
      </section>

      <section id="setup-screen" class="screen">
        <div class="panel">
          <h2 id="setup-title">Ustawienia meczu</h2>

          <div class="field-row">
            <label id="label-player-count" for="player-count">Liczba zawodników</label>
            <select id="player-count">
              <option value="1">1</option>
              <option value="2" selected>2</option>
              <option value="3">3</option>
              <option value="4">4</option>
            </select>
          </div>

          <div id="players-inputs" class="players-grid"></div>

          <div class="field-row">
            <span id="label-out-mode">Zakończenie lega</span>
            <div class="toggle-wrap">
              <label><input type="radio" name="out-mode" value="double" checked /> Double out</label>
              <label><input type="radio" name="out-mode" value="single" /> Single out</label>
            </div>
          </div>

          <div class="field-row">
            <label id="label-start-score" for="start-score">Start punktów</label>
            <select id="start-score">
              <option value="301">301</option>
              <option value="501" selected>501</option>
              <option value="701">701</option>
            </select>
          </div>

          <button id="start-game" class="primary-btn">Dalej</button>
        </div>
      </section>

      <section id="game-screen" class="screen">
        <div class="game-header">
          <h2 id="match-title">Mecz</h2>
          <div class="game-controls">
            <button id="back-to-setup" class="ghost-btn">← <span id="back-to-setup-label">Edytuj zawodników</span></button>
            <button id="undo-turn" class="ghost-btn"><span id="undo-turn-label">Cofnij turę</span></button>
            <button id="new-game" class="ghost-btn"><span id="new-game-label">Nowa gra</span></button>
          </div>
        </div>

        <div class="game-layout">
          <div class="score-side">
            <article id="current-player-card" class="current-player-card"></article>
            <ul id="players-list" class="players-list"></ul>
          </div>

          <div class="input-side">
            <div class="score-input-box">
              <input id="score-input" type="text" inputmode="numeric" placeholder="Wpisz wynik tury" data-pl="Wpisz wynik tury" data-en="Enter turn score" readonly />
              <button id="submit-score" class="primary-btn" data-pl="Zatwierdź" data-en="Submit">Zatwierdź</button>
            </div>

            <div class="keypad" id="keypad"></div>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
